# /etc/nginx/sites-available/APP_NAME   (replace APP_NAME and example.com)
# Get HTTPS with: sudo certbot --nginx -d example.com
server {
    listen 80;
    server_name example.com;

    client_max_body_size 10M;
    root /srv/APP_NAME/frontend/dist;   # the built React app

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/   { proxy_pass http://unix:/run/APP_NAME/gunicorn.sock; include /etc/nginx/proxy_params; }
    location /admin/ { proxy_pass http://unix:/run/APP_NAME/gunicorn.sock; include /etc/nginx/proxy_params; }
    location /static/ { alias /srv/APP_NAME/backend/staticfiles/; expires 30d; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # React Router: unknown paths load index.html and the app decides what to show.
    location / { try_files $uri /index.html; }
}
