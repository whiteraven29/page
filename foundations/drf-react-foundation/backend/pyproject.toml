[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*", "templates/app_template"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, DJ: Django rules, S: security
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # assert is how pytest checks things

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"conftest.py" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
